# release.yml: build the plugin package for a version tag and publish it as a
# GitHub release, where the .plg expects it
# (releases/download/<version>/veracrypt.mount-<version>-noarch-1.txz).
#
# How to release:
#   1. python scripts/build.py <version>      (writes version and SHA256 into the .plg)
#   2. commit the .plg, then: git tag <version> && git push origin main <version>
#
# This workflow never changes the repository. It rebuilds the package from the
# tagged sources and refuses to publish unless the .plg committed with that tag
# describes exactly this package (build.py --check; builds are reproducible).
#
# Only GitHub's own tools are used: actions/checkout, pinned to a fixed commit,
# and the php and gh commands that GitHub's runners include.

name: Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9][a-z]'

permissions:
  contents: write   # to create the release; nothing else

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false

      - name: Check the engine and the PHP files for syntax errors
        # Cron runs the engine with its output thrown away (idle lock), so a
        # syntax error would go unnoticed on the server. Refuse it here.
        run: |
          set -e
          dir=src/usr/local/emhttp/plugins/veracrypt.mount
          for f in "$dir/scripts/vcmount" "$dir"/include/*.php "$dir"/*.page; do php -l "$f"; done

      - name: Check the shell scripts, the page scripts and the .plg
        # The hooks run at array stop, where an error would go unnoticed
        # (audit 2026-11-27c S2).
        run: |
          set -e
          dir=src/usr/local/emhttp/plugins/veracrypt.mount
          for f in "$dir"/event/* src/usr/local/sbin/vcmount; do bash -n "$f"; done
          for f in "$dir"/js/*.js; do node --check "$f"; done
          python3 -I -c "import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" plugin/veracrypt.mount.plg

      - name: Build the package and check it against the .plg
        run: python3 -I scripts/build.py --check "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/veracrypt.mount-$GITHUB_REF_NAME-noarch-1.txz" \
            plugin/veracrypt.mount.plg \
            --repo "$GITHUB_REPOSITORY" \
            --title "VeraCrypt Mount $GITHUB_REF_NAME" \
            --notes "Install: Plugins > Install Plugin, with the address of veracrypt.mount.plg from this release or from the main branch."
